spring.application.name=slot25-security-jwt
server.port=8080

# Primary datasource config (H2 in-memory for zero-friction execution, with SQL Server template ready)
spring.datasource.url=jdbc:h2:mem:orchiddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Microsoft SQL Server configuration (uncomment when connected to local MS SQL Server)
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OrchidManagementDB;encrypt=true;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

