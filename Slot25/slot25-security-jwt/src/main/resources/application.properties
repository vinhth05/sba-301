security.jwt.secret=c2JhMzAxLXNsb3QyNS1zZWNyZXQta2V5LW9yY2hpZC1qd3QtdG9rZW4tdmVyeS1sb25nLWFuZC1zZWN1cmUta2V5LTIwMjY=
security.jwt.expiration-ms=900000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.fpt.sba301.security=DEBUG
