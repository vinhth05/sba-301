spring.application.name=A3TranHienVinh_SE1910
server.port=8080

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A3TranHienVinh_SE1910;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
