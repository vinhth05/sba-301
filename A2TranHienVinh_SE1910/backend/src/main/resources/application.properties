spring.application.name=A2TranHienVinh_SE1910
server.port=8080

# SQL Server Configuration
# Note: You can switch databaseName to A2TranHienVinh_SE1910 or FUNewsManagementSBA301 based on your local SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A2TranHienVinh_SE1910;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
