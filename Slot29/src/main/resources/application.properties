# ===================================================================
# SBA301 - Slot 29: Microsoft SQL Server Configuration
# ===================================================================

# Database Connection Settings
hibernate.connection.driver_class=com.microsoft.sqlserver.jdbc.SQLServerDriver
hibernate.connection.url=jdbc:sqlserver://localhost:1433;databaseName=LibraryDB;encrypt=true;trustServerCertificate=true
hibernate.connection.username=sa
hibernate.connection.password=123456

# Hibernate Dialect
hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# SQL Logging & Formatting
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.highlight_sql=true

# Database Schema Auto Strategy (update / validate / create / create-drop)
hibernate.hbm2ddl.auto=update

# Connection Pool Optimization
hibernate.connection.pool_size=10
